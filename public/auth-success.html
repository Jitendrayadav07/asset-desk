<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <title>Sign-in Result</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f3f2f1;
      color: #323130;
      padding: 24px;
    }
    .card {
      background: #fff;
      padding: 32px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 720px;
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .status { font-size: 14px; margin-bottom: 20px; }
    .ok  { color: #107c10; }
    .err { color: #a4262c; }
    .row {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 8px 16px;
      margin-bottom: 4px;
      padding: 8px 0;
      border-bottom: 1px solid #edebe9;
      font-size: 14px;
    }
    .row:last-of-type { border-bottom: none; }
    .key { color: #605e5c; font-weight: 500; }
    .val { word-break: break-all; font-family: ui-monospace, "SF Mono", monospace; font-size: 13px; }
    pre {
      background: #faf9f8;
      border: 1px solid #edebe9;
      padding: 12px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
      margin: 16px 0 0;
    }
    .actions { margin-top: 24px; display: flex; gap: 12px; }
    button, .btn {
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 2px;
      cursor: pointer;
      border: 1px solid #8a8886;
      background: #fff;
      color: #323130;
      text-decoration: none;
      display: inline-block;
    }
    button.primary { background: #0078d4; color: #fff; border-color: #0078d4; }
    button:hover { background: #f3f2f1; }
    button.primary:hover { background: #106ebe; }
    .loader { color: #605e5c; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Microsoft Login</h1>
    <div id="status" class="status loader">Exchanging cookie for JWT…</div>
    <div id="details"></div>
    <div class="actions" id="actions" style="display:none;">
      <a class="btn" href="/">Back to login</a>
      <button class="primary" id="copyToken">Copy JWT</button>
    </div>
  </div>

  <script>
    const statusEl  = document.getElementById("status");
    const detailsEl = document.getElementById("details");
    const actionsEl = document.getElementById("actions");
    const copyBtn   = document.getElementById("copyToken");

    let jwtToken = null;

    function row(key, val) {
      return '<div class="row"><div class="key">' + key + '</div><div class="val">' + (val ?? "—") + '</div></div>';
    }

    (async () => {
      try {
        const res = await fetch("/api/auth/login/microsoft-success", {
          credentials: "include",
        });
        const body = await res.json();

        if (!res.ok || !body.isSuccess) {
          statusEl.className = "status err";
          statusEl.textContent = "✗ " + (body.message || "Login failed (HTTP " + res.status + ")");
          detailsEl.innerHTML = "<pre>" + JSON.stringify(body, null, 2) + "</pre>";
          return;
        }

        const u = body.result || {};
        jwtToken = u.token;

        statusEl.className = "status ok";
        statusEl.textContent = "✓ Logged in successfully";

        detailsEl.innerHTML =
          row("User ID",       u.id) +
          row("Email",         u.email) +
          row("Display name",  u.display_name) +
          row("Given name",    u.given_name) +
          row("Family name",   u.family_name) +
          row("Microsoft ID",  u.microsoft_id) +
          row("Login type",    u.login_type + " (3 = Microsoft)") +
          row("Is active",     u.is_active) +
          row("Last login",    u.last_login) +
          row("Created at",    u.created_at) +
          "<pre>JWT:\n" + (u.token || "—") + "</pre>";

        actionsEl.style.display = "flex";
      } catch (err) {
        statusEl.className = "status err";
        statusEl.textContent = "✗ Network error: " + err.message;
      }
    })();

    copyBtn.addEventListener("click", async () => {
      if (!jwtToken) return;
      await navigator.clipboard.writeText(jwtToken);
      copyBtn.textContent = "Copied!";
      setTimeout(() => (copyBtn.textContent = "Copy JWT"), 1500);
    });
  </script>
</body>
</html>
